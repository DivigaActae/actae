[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: tests that modify Docker container state or take >30s
    asyncio: async WebSocket tests
    performance: throughput and load tests
    security: tests requiring TLS/mTLS (skipped in dev mode)
    requires_pg: tests requiring direct Postgres access (skipped in dev mode)
    conformance: control-plane e2e matrix (ACTAE_CONFORMANCE=1) — spawns stub
        control planes and dedicated Actae instances (non-dev mode, against
        its own PostgreSQL); carries its own generous per-test timeout marks
    lifecycle: dev-mode lifecycle suite (ACTAE_LIFECYCLE=1) — spawns
        dedicated `actae --dev` instances; restart persistence, SIGKILL
        orphan recovery, port-bump isolation
    timeout: per-test timeout overrides (pytest-timeout), used by the live
        LLM-judged fidelity and token-report suites
timeout = 60
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
addopts = -v --tb=short --strict-markers --import-mode=importlib
filterwarnings =
    ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning
