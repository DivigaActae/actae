name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --target ${{ matrix.target }}
        working-directory: actae
      - run: |
          tar -czf "actae-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            -C "actae/target/${{ matrix.target }}/release" actae
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum actae-*.tar.gz > "SHA256SUMS-${{ matrix.target }}"
          else
            shasum -a 256 actae-*.tar.gz > "SHA256SUMS-${{ matrix.target }}"
          fi
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: "actae-*.tar.gz"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            actae-*.tar.gz
            SHA256SUMS-${{ matrix.target }}
          generate_release_notes: true

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: actae.spdx.json
