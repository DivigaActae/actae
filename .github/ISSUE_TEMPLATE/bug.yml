name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, keys, or customer data.
        Security issues: see SECURITY.md, not here.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options: [curl, brew, docker, tarball, built from source]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact hostnames and keys
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: I removed secrets, keys and customer data from this report
          required: true
